name: Browser and offline smoke
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm install --no-save --no-audit --no-fund playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Test actual game in Chromium
        shell: bash
        run: |
          set -e
          npm exec vite preview -- --host 127.0.0.1 --port 4173 > /tmp/ceo-preview.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          mkdir -p browser-evidence
          cat > browser-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser = await chromium.launch();
          const context = await browser.newContext({viewport:{width:800,height:360}});
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', e => errors.push(e.message));
          try {
            await page.goto('http://127.0.0.1:4173/');
            await page.getByLabel('Company name').fill('Smoke Industries');
            await page.getByLabel('CEO name').fill('Test CEO');
            await page.getByRole('button',{name:'Accept takeover'}).click();
            await page.getByRole('button',{name:'Accept takeover'}).waitFor({state:'hidden'});
            const nav=page.getByRole('navigation',{name:'Management departments'});
            assert.equal(await nav.getByRole('button').count(),12);
            await page.screenshot({path:'browser-evidence/landscape.png'});
            await nav.getByRole('button',{name:'Company',exact:true}).click();
            const dialog=page.getByRole('dialog');
            for(let i=0;i<6;i++){
              await dialog.getByRole('button',{name:'Inspect',exact:true}).first().click();
              await page.waitForFunction(n=>document.querySelectorAll('dialog button').length>=1 && [...document.querySelectorAll('dialog button')].filter(b=>b.textContent.trim()==='Inspect').length===n,5-i);
            }
            await page.screenshot({path:'browser-evidence/M02-company.png'});
            await dialog.getByRole('button',{name:'CEO dashboard',exact:true}).click();
            await dialog.getByRole('heading',{name:'CEO dashboard',exact:true}).waitFor();
            await page.screenshot({path:'browser-evidence/M01-dashboard.png'});
            await dialog.getByRole('button',{name:'Close panel'}).click();
            await nav.getByRole('button',{name:'Procurement'}).click();
            await dialog.getByLabel('Grams').fill('1000');
            await dialog.getByLabel('Supplier payment terms').selectOption('7');
            await dialog.getByRole('button',{name:'Place order',exact:true}).click();
            const creditOrder=dialog.locator('.journal').filter({hasText:'flour · 1,000'});
            await creditOrder.getByText('Credit',{exact:false}).waitFor();
            page.once('dialog', confirmation=>confirmation.accept());
            await creditOrder.getByRole('button',{name:'Cancel order',exact:true}).click();
            await creditOrder.waitFor({state:'detached'});
            await dialog.getByLabel('Grams').fill('75000');
            await dialog.getByLabel('Supplier payment terms').selectOption('0');
            await dialog.getByRole('button',{name:'Place order',exact:true}).click();
            await dialog.getByText('flour · 75,000',{exact:true}).waitFor();
            await page.screenshot({path:'browser-evidence/procurement.png'});
            await dialog.getByRole('button',{name:'Close panel'}).click();
            // Reachability of the management routes; this is not full action coverage.
            for(const name of ['Quick actions','Employees','Warehouse','Production','Sales','Market','Finance','Banking','Research','Business news']){
              await nav.getByRole('button',{name,exact:true}).click();
              await dialog.getByRole('heading',{name,exact:true}).first().waitFor();
              await page.screenshot({path:'browser-evidence/panel-'+name.replaceAll(' ','-')+'.png'});
              if(name==='Production'){
                for(const sub of ['Machinery','Quality']){
                  await dialog.getByRole('button',{name:sub,exact:true}).click();
                  await dialog.getByRole('heading',{name:sub,exact:true}).first().waitFor();
                  await page.screenshot({path:'browser-evidence/panel-'+sub+'.png'});
                  await dialog.getByRole('button',{name:'Close panel'}).click();
                  await nav.getByRole('button',{name:'Production',exact:true}).click();
                }
              }
              if(name==='Market'){
                await dialog.getByRole('button',{name:'Marketing',exact:true}).click();
                await dialog.getByRole('heading',{name:'Marketing',exact:true}).first().waitFor();
                await page.screenshot({path:'browser-evidence/panel-Marketing.png'});
              }
              await dialog.getByRole('button',{name:'Close panel'}).click();
            }
            await page.evaluate(async()=>{await navigator.serviceWorker.ready});
            await page.reload();
            await nav.getByRole('button',{name:'Warehouse'}).waitFor();
            await page.waitForFunction(()=>Boolean(navigator.serviceWorker.controller));
            await context.setOffline(true);
            await page.reload();
            await nav.getByRole('button',{name:'Company',exact:true}).waitFor();
            await nav.getByRole('button',{name:'Company',exact:true}).click();
            await dialog.getByText('Smoke Industries',{exact:true}).waitFor();
            await dialog.getByRole('button',{name:'Close panel'}).click();
            await page.screenshot({path:'browser-evidence/offline.png'});
            // All stage assets must be cached even before their milestones are reached.
            const images=await page.evaluate(async()=>Promise.all([1,2,3,4,5].map(async n=>{const img=new Image();img.src=new URL('offices/stage-'+n+'.svg',document.baseURI).href;await img.decode();return img.naturalWidth>0})));
            assert.deepEqual(images,[true,true,true,true,true]);
            await page.getByRole('button',{name:'Settings',exact:true}).click();
            await dialog.getByLabel('Reduce interface motion').check();
            assert.equal(await page.locator('main.game').getAttribute('data-reduced-motion'),'true');
            await page.keyboard.press('Escape');
            await dialog.waitFor({state:'hidden'});
            for(const [width,height] of [[640,360],[800,360],[1280,720],[1536,702],[1024,768],[360,800]]){
              await page.setViewportSize({width,height});
              await page.screenshot({path:'browser-evidence/layout-'+width+'x'+height+'.png'});
              assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth),true);
            }
            assert.deepEqual(errors,[]);
            console.log('Browser smoke passed: takeover, 12 dock controls, audit, credit purchase/cancellation, prepaid purchase, management route reachability, persistence, offline reload, portrait screenshot.');
          } finally { await browser.close(); }
          EOF
          node browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: browser-evidence
