name: Android QA APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/android-qa.yml'
permissions:
  contents: read
jobs:
  qa-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Generate and configure Android shell
        shell: bash
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/variables.gradle')
          text=p.read_text()
          for name in ('compileSdkVersion','targetSdkVersion'):
              text,n=re.subn(r'('+name+r'\s*=\s*)\d+',r'\g<1>36',text)
              if n != 1: raise RuntimeError('Cannot locate '+name)
          p.write_text(text)
          p=Path('android/app/src/main/AndroidManifest.xml')
          text=p.read_text()
          text,n=re.subn(r'(<activity\b(?:(?!>).)*android:name="\.MainActivity")',r'\1 android:screenOrientation="sensorLandscape"',text,count=1,flags=re.S)
          if n != 1: raise RuntimeError('Cannot configure MainActivity orientation')
          p.write_text(text)
          PY
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Record QA package hash
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android-qa-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-qa-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-qa-sha256.txt
      - name: Prepare generated native source evidence
        run: |
          tar --exclude=android/.gradle --exclude=android/app/build --exclude=android/build --exclude=android/app/src/main/assets/public --exclude=android/local.properties -czf android-source.tar.gz android
      - uses: actions/upload-artifact@v4
        with:
          name: android-generated-source
          path: android-source.tar.gz
