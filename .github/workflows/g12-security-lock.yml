name: G12 resolve security lockfile
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  resolve:
    if: github.repository == 'S2zxx0zxx/The-CEO-Company-Simulator-' && github.event.pull_request.number == 1 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/company-simulator-v3'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: g12-resolved-lock
          path: package-lock.json
  promote:
    needs: resolve
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: g12-resolved-lock
          path: /tmp/g12-lock
      - run: |
          set -e
          cp /tmp/g12-lock/package-lock.json package-lock.json
          git add -- package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Resolve audited security dependency upgrades'
          git push origin HEAD:refs/heads/feat/company-simulator-v3
